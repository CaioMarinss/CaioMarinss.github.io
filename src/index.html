<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script>
    try {
      var d = document, c = d.createElement('canvas');
      if (!/^\/(curriculo|en\/resume)\/?$/.test(location.pathname) && matchMedia('(min-width: 861px) and (hover: hover) and (pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches && (c.getContext('webgl2') || c.getContext('webgl'))) {
        d.documentElement.classList.add('is-cinema');
        // Safety net: cinema CSS hides copy until the app runs. If the bundle never boots
        // (network error, blocker, bootstrap crash), drop back to the static layout.
        addEventListener('load', function () {
          setTimeout(function () {
            if (!d.documentElement.hasAttribute('data-booted')) d.documentElement.classList.remove('is-cinema');
          }, 2000);
        });
      }
    } catch (e) {}
  </script>
