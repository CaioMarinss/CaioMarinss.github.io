@let c = content();
<section id="jiujitsu" class="ch jiujitsu" data-chapter="1" tabindex="-1" [attr.aria-label]="c.life.nav.jiujitsu">
  <p class="kicker fade">{{ c.life.jiujitsu.kicker }}</p>
  <app-title-words [lines]="c.life.jiujitsu.title" />
  <div class="body">
    <p class="desc fade">{{ c.life.jiujitsu.text }}</p>
    <ul class="facts meta fade d2">
      @for (fact of c.life.jiujitsu.facts; track fact) {
        <li>{{ fact }}</li>
      }
    </ul>
    <!-- Optional photo slot: add a <figure> here once there is a picture. -->
  </div>
</section>
