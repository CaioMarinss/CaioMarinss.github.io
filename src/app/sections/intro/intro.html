@let c = content();
<section id="intro" class="ch intro" data-chapter="0" tabindex="-1" [attr.aria-label]="c.nav.intro">
  <p class="kicker fade">{{ c.intro.kicker }}</p>
  <app-title-words [lines]="c.intro.title" [level]="1" />
  <div class="cols">
    @for (p of c.intro.paragraphs; track $index) {
      <p class="desc fade" [class.d2]="$index === 1">{{ p }}</p>
    }
  </div>
  <span class="scroll fade" aria-hidden="true">{{ c.ui.scrollHint }}</span>
</section>
